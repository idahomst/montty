name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Cargo.toml and the PKGBUILD must already carry the tag's version: otherwise the
      # packages would be named for the tag while the binary reports the old version.
      - name: Version
        id: version
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          pkgver=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          version=$cargo_version
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          fi
          if [ "$cargo_version" != "$version" ] || [ "$pkgver" != "$version" ]; then
            echo "::error::version mismatch: tag/version $version, Cargo.toml $cargo_version, PKGBUILD $pkgver"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Tests need no display: the one that does (tests/device_events.rs) skips itself without $DISPLAY.
      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Debian package
        run: packaging/deb/build-deb.sh "${{ steps.version.outputs.version }}" target/release/montty dist

      - name: Tarball
        run: |
          v=${{ steps.version.outputs.version }}
          dir=montty-$v
          mkdir -p "$dir/bin" "$dir/assets" "$dir/docs"
          install -m755 target/release/montty "$dir/bin/montty"
          cp -r assets/icon "$dir/assets/icon"
          cp assets/montty.desktop "$dir/assets/"
          # The binary embeds the MPL-licensed Tilix schemes.
          cp assets/schemes/LICENSE-NOTICE "$dir/LICENSE-SCHEMES"
          cp LICENSE README.md "$dir/"
          cp docs/install.md docs/config.md "$dir/docs/"
          mkdir -p dist
          tar czf "dist/montty-$v-x86_64-linux.tar.gz" "$dir"

      - name: Source tarball for the Arch build
        run: |
          v=${{ steps.version.outputs.version }}
          mkdir -p src-dist
          git archive --prefix="montty-$v/" -o "src-dist/montty-$v.tar.gz" HEAD

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: source
          path: src-dist/*
          if-no-files-found: error

  arch:
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed git rust \
            fontconfig ttf-dejavu noto-fonts-emoji \
            libglvnd libx11 libxcursor libxi libxkbcommon libxkbcommon-x11 wayland

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: source
          path: source

      - name: makepkg
        run: |
          # makepkg refuses to run as root.
          useradd -m builder
          cp -r packaging/arch /home/builder/build
          cp source/montty-*.tar.gz /home/builder/build/
          chown -R builder:builder /home/builder/build
          su builder -c 'cd ~/build && makepkg -f --noconfirm'
          mkdir -p out
          cp /home/builder/build/*.pkg.tar.zst out/

      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: out/*.pkg.tar.zst
          if-no-files-found: error

  macos:
    needs: build
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build (Apple Silicon and Intel)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Universal binary
        run: |
          lipo -create -output montty \
            target/aarch64-apple-darwin/release/montty \
            target/x86_64-apple-darwin/release/montty
          lipo -info montty

      - name: App bundle and dmg
        run: packaging/macos/build-app.sh "${{ needs.build.outputs.version }}" montty out

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: out/*.dmg
          if-no-files-found: error

  release:
    needs: [build, arch, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: files

      - uses: actions/download-artifact@v8
        with:
          name: arch
          path: files

      - uses: actions/download-artifact@v8
        with:
          name: macos
          path: files

      - name: List
        run: ls -l files

      - uses: softprops/action-gh-release@v3
        with:
          files: files/*
          generate_release_notes: true
          draft: false
